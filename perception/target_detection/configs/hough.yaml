method: hough
preprocessing:
  # Convert BGR input to grayscale, then smooth edges before Hough voting.
  equalize_histogram: false
  blur:
    type: median
    kernel_size: 5
hough:
  dp: 1.2
  min_dist: 90
  param1: 120
  param2: 28
  min_radius: 10
  max_radius: 80
duplicate_suppression:
  enabled: true
  center_distance_factor: 0.5
  iou_threshold: 0.55