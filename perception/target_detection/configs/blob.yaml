method: blob
preprocessing:
  # Convert BGR input to grayscale, then lightly smooth threshold noise.
  equalize_histogram: false
  blur:
    type: gaussian
    kernel_size: 3
    sigma_x: 0
blob:
  min_threshold: 10
  max_threshold: 240
  threshold_step: 10
  min_dist_between_blobs: 20
  filter_by_color: true
  blob_color: 255
  filter_by_area: true
  min_area: 120
  max_area: 25000
  filter_by_circularity: true
  min_circularity: 0.65
  filter_by_convexity: false
  min_convexity: 0.75
  filter_by_inertia: false
  min_inertia_ratio: 0.1